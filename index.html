<!doctype html>
<html lang="en" class="splashing">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Blue while the launch splash shows (so the phone's status-bar area
         matches it); App.jsx switches it back to white when the splash ends. -->
    <meta name="theme-color" content="#1463F4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tracka+" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint (media=print → all once
         loaded): a render-blocking stylesheet held the splash back ~1.5s. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>tracka+</title>
    <link rel="preload" as="image" href="/logo%202.jpg" />
    <!-- Launch splash: the white drop on a full blue screen for ~2.5s, then
         it fades into the app. Plain HTML/CSS so it shows before the app's
         code has loaded; App.jsx fades it out once it has finished and the
         session is known. -->
    <style>
      /* The page behind the splash is blue too, so nothing white can show
         at the edges (status-bar area, overscroll) while it's up. */
      html.splashing, html.splashing body { background: #1463f4; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1463f4;
        /* Holds for 2.5s; its end is what the app waits for. */
        animation: splash-hold 2.5s linear forwards;
        transition: opacity 0.45s ease;
      }
      #splash.splash--leaving { opacity: 0; pointer-events: none; }
      #splash img {
        width: 300px;
        height: 300px;
        max-width: 75vw;
        max-height: 75vw;
        animation: splash-drop 0.7s ease-out both;
      }
      @keyframes splash-hold { from { opacity: 1; } to { opacity: 1; } }
      @keyframes splash-drop {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="img" aria-label="Tracka+ is loading">
      <img src="/logo%202.jpg" alt="" />
    </div>
    <script>
      // Mark the splash done when its own 2.5s hold ends (it can start a
      // beat after page load), so App.jsx never cuts it short.
      (function () {
        var s = document.getElementById('splash')
        var done = function () { s.dataset.done = '1'; s.dispatchEvent(new Event('splashdone')) }
        if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(done, 1500)
        else s.addEventListener('animationend', function (e) { if (e.target === s) done() })
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
